name: litworkbench
services:
  app:
    build:
      context: ..
      args:
        WITH_OCR: ${WITH_OCR:-false}
    image: litworkbench:cloud
    restart: unless-stopped
    init: true
    env_file: .env
    ports:
      - "127.0.0.1:18876:8000"
    volumes:
      - ${LIT_DATA_DIR:?Set the initialized workspace directory}:/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    mem_limit: 768m
    cpus: 0.75
    pids_limit: 128
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/health',headers={'Host':os.environ['LIT_ALLOWED_HOSTS'].split(',')[0]}); urllib.request.urlopen(r,timeout=3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
