name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: build windows package
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-client/package-lock.json
      - name: build frontend
        working-directory: web-client
        run: npm ci; npm run build
      - name: build python artifacts
        run: python -m pip install --upgrade pip build && python -m build --outdir dist-python
      - name: assemble zip
        run: python scripts/package_release.py --out dist-release --version "${env:GITHUB_REF_NAME}"
      - name: upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/*.zip
            dist-python/*
          generate_release_notes: true