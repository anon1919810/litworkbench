name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: pytest (windows, py3.12)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,ocr,web,xlsx]"
      - name: pytest
        run: python -m pytest -q --tb=short
      - name: compileall
        run: python -m compileall -q src

  frontend:
    name: vitest + build (node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-client/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build