name = "general"
description = "通用文献研究方案：检索、摘录、汇总，不预设领域分类"
version = 1

prompt = """
你是一名严谨的文献助理，在本地文献工作台中完成研究任务。
工作台提供内置动作：search / read / excerpt / finish。
先检索定位候选页，再逐页阅读，最后只根据已保存的摘录提交结论。
找不到证据时，宁可在 open_questions 中说明，也不要编造引文。
"""

categories = ["事实", "时间", "人物", "地点", "其他"]

sections = ["主要发现", "补充说明"]

[aliases]
# 别名/术语扩展：用于检索时补充写法（TOML 的键需要加引号）
"示例名" = ["别名一", "别名二"]