<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="文献案头（暂定名）设计草图：本地文献检索、原页对读、摘录与研究项目。全部数据为演示，不连接真实文献库。">
<meta name="color-scheme" content="light">
<title>文献案头 · 设计草图（演示）</title>
<style>
/* ============================================================
   文献案头 · 设计草图
   配色：暖象牙底 #F7F5F0 / 白工作面 / 墨色 #252A27
   强调：林绿 #4D6555 ; 待核验：赭黄 #A5762B
   无外部字体、无外部资源、无网络请求
   ============================================================ */
:root{
  --ivory:#F7F5F0;
  --paper:#FFFFFF;
  --ink:#252A27;
  --ink-2:#4C534E;
  --ink-3:#7C847D;
  --line:#E4E0D7;
  --line-2:#D2CCBF;
  --accent:#4D6555;
  --accent-2:#3C5145;
  --accent-soft:#EEF2EE;
  --ochre:#A5762B;
  --ochre-soft:#FAF2E1;
  --rust:#8C5A46;
  --rust-soft:#F6EDE8;
  --radius:6px;
  --sidebar:196px;
  --ui:"Noto Sans SC","Microsoft YaHei","PingFang SC","Hiragino Sans GB","Source Han Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC",SimSun,"宋体",serif;
  --shadow:0 1px 2px rgba(37,42,39,.05);
  --row:8px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--ivory);color:var(--ink);
  font:400 14px/1.6 var(--ui);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,p,ul,ol,figure{margin:0}
ul,ol{padding:0;list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.serif{font-family:var(--serif)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.skip{position:absolute;left:-9999px;top:0;background:var(--paper);border:1px solid var(--line-2);padding:6px 10px;z-index:99}
.skip:focus{left:8px;top:8px}

/* ---------- 布局骨架 ---------- */
.app{display:flex;height:100%;min-height:0}
.sidebar{
  width:var(--sidebar);flex:0 0 var(--sidebar);
  background:var(--ivory);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;
}
.col{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;min-height:0}
.workspace{flex:1 1 auto;min-height:0;min-width:0;display:flex;flex-direction:column}
.workspace.view-scroll{overflow-y:auto;overflow-x:hidden}
.workspace.view-search{overflow:hidden}

/* ---------- 侧栏 ---------- */
.brand{padding:12px 12px 10px;border-bottom:1px solid var(--line)}
.brand-row{display:flex;align-items:baseline;gap:6px}
.brand-mark{
  width:16px;height:16px;border:1px solid var(--accent);border-radius:3px;flex:0 0 auto;
  position:relative;align-self:center;background:#fff;
}
.brand-mark::after{content:"";position:absolute;left:3px;right:3px;top:6px;height:1px;background:var(--accent);box-shadow:0 3px 0 var(--accent)}
.brand-name{font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:.06em}
.brand-sub{margin-top:3px;font-size:11px;color:var(--ink-3);letter-spacing:.02em}
.nav{padding:8px 8px;display:flex;flex-direction:column;gap:1px;overflow-y:auto}
.nav-item{
  display:flex;align-items:center;gap:8px;width:100%;
  padding:6px 8px;border:1px solid transparent;border-left:2px solid transparent;
  border-radius:var(--radius);background:transparent;text-align:left;
  font-size:13.5px;color:var(--ink-2);
}
.nav-item:hover{background:rgba(255,255,255,.75)}
.nav-item[aria-current="page"]{
  background:var(--paper);border-color:var(--line);border-left-color:var(--accent);
  color:var(--ink);font-weight:600;box-shadow:var(--shadow);
}
.nav-idx{font-size:10.5px;color:var(--ink-3);width:16px;flex:0 0 auto;font-variant-numeric:tabular-nums}
.nav-item[aria-current="page"] .nav-idx{color:var(--accent)}
.nav-badge{
  margin-left:auto;font-size:10.5px;color:var(--ink-3);background:var(--ivory);
  border:1px solid var(--line);border-radius:20px;padding:0 5px;font-variant-numeric:tabular-nums;
}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding:9px 12px;font-size:11.5px;color:var(--ink-3)}
.side-foot p{margin:0 0 2px}
.foot-state{display:flex;align-items:center;gap:6px;color:var(--ink-2)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block;flex:0 0 auto}
.dot-b{background:var(--ochre)}
.dot-r{background:var(--rust)}
.path{font-family:var(--serif);color:var(--ink-2)}

/* ---------- 顶栏 / 提示条 ---------- */
.topbar{
  background:var(--paper);border-bottom:1px solid var(--line);
  padding:8px 16px;display:flex;align-items:center;gap:12px;min-height:46px;flex:0 0 auto;
}
.topbar h1{font-size:15px;font-weight:600;letter-spacing:.01em}
.topbar .sub{font-size:11.5px;color:var(--ink-3);margin-top:1px}
.top-acts{margin-left:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.banner{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  background:var(--ochre-soft);border-bottom:1px solid #EDE1C8;
  padding:6px 16px;font-size:12px;color:#6E5220;
}
.banner b{font-weight:600}
.banner .link-btn{
  border:1px solid #E0D0AE;background:#fff;color:#6E5220;border-radius:var(--radius);
  padding:1px 7px;font-size:11.5px;
}
.banner .link-btn:hover{background:#FFFDF8}

/* ---------- 通用控件 ---------- */
.btn{
  border:1px solid var(--line-2);background:var(--paper);color:var(--ink);
  border-radius:var(--radius);padding:5px 11px;font-size:13px;line-height:1.4;
  box-shadow:var(--shadow);white-space:nowrap;
}
.btn:hover{background:#FCFBF8;border-color:#BDB6A6}
.btn:active{background:#F3F1EB}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn-ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--ink-2);padding:4px 7px}
.btn-ghost:hover{background:rgba(37,42,39,.05);border-color:transparent}
.btn-sm{padding:3px 9px;font-size:12.5px}
.btn-danger{background:var(--rust);border-color:var(--rust);color:#fff}
.btn-danger:hover{background:#764936;border-color:#764936}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-sm-ghost{box-shadow:none}
.chip{
  display:inline-flex;align-items:center;gap:4px;font-size:11px;line-height:1.6;
  border:1px solid var(--line-2);border-radius:20px;padding:0 7px;color:var(--ink-2);background:var(--paper);
  white-space:nowrap;
}
.chip-accent{border-color:#C3D0C6;background:var(--accent-soft);color:var(--accent-2)}
.chip-ochre{border-color:#E3D0A8;background:var(--ochre-soft);color:#7C5716}
.chip-demo{border-style:dashed;color:var(--ink-3)}
.state{font-size:11px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.state::before{content:"";width:7px;height:7px;border-radius:2px;flex:0 0 auto}
.state-accepted{color:var(--accent-2)}
.state-accepted::before{background:var(--accent)}
.state-pending{color:#7C5716}
.state-pending::before{background:var(--ochre);border-radius:50%}
.state-stale{color:var(--rust)}
.state-stale::before{background:var(--rust);border-radius:0;transform:rotate(45deg)}
.state-none{color:var(--ink-3)}
.state-none::before{background:var(--line-2)}
.state-failed{color:var(--rust)}
.state-failed::before{background:var(--rust);border-radius:50%}
.state-run{color:var(--accent-2)}
.state-run::before{background:var(--accent);border-radius:50%}
.state-pause{color:var(--ink-2)}
.state-pause::before{background:var(--ink-3);border-radius:0;border-top:3px double transparent}
input[type="text"],input[type="url"],input[type="search"],input[type="password"],select,textarea{
  border:1px solid var(--line-2);border-radius:var(--radius);background:var(--paper);
  padding:5px 9px;font-size:13px;max-width:100%;
}
input[type="text"]:disabled,input[type="password"]:disabled{
  background:#F4F2EC;color:var(--ink-3);cursor:not-allowed;border-style:dashed;
}
textarea{resize:vertical;min-height:66px;line-height:1.7}
label.lbl{display:block;font-size:12px;color:var(--ink-2);margin:0 0 3px}
.field{margin-bottom:12px}
.help{font-size:11.5px;color:var(--ink-3);margin-top:4px;line-height:1.6}
.err{font-size:11.5px;color:var(--rust);margin-top:4px}
fieldset{border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin:0 0 12px}
legend{padding:0 4px;font-size:12px;color:var(--ink-2)}
.radio-row{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;padding-top:2px}
.radio-row label{display:flex;align-items:center;gap:5px}
input[type="radio"],input[type="checkbox"]{accent-color:var(--accent)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{
  text-align:left;font-weight:600;font-size:11.5px;color:var(--ink-3);letter-spacing:.04em;
  padding:6px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap;background:#FBFAF6;
}
table.tbl td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.tbl tr:last-child td{border-bottom:0}
table.tbl tbody tr:hover{background:#FBFAF7}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper)}
.panel-box{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}

/* ---------- 检索视图 ---------- */
.search-head{flex:0 0 auto;background:var(--paper);border-bottom:1px solid var(--line);padding:9px 14px}
.search-row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.search-field{flex:1 1 260px;min-width:0;display:flex;align-items:center;gap:7px;
  border:1px solid var(--line-2);border-radius:var(--radius);background:var(--paper);padding:3px 4px 3px 9px}
.search-field:focus-within{border-color:var(--accent)}
.search-field input[type="search"]{border:0;padding:3px 0;flex:1 1 auto;min-width:0;background:transparent}
.search-field input[type="search"]:focus{outline:none}
.filter-row{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:7px}
.filter-row .flabel{font-size:11.5px;color:var(--ink-3)}
.filter-row select{padding:3px 7px;font-size:12.5px;background:#FCFBF8}
.mode-note{
  margin-top:7px;padding:5px 9px;border:1px solid var(--line);border-left:2px solid var(--accent);
  border-radius:var(--radius);background:#FBFAF7;font-size:11.5px;color:var(--ink-2);line-height:1.65;
}
.mode-note b{color:var(--ink)}
.split{flex:1 1 auto;min-height:0;min-width:0;display:flex;overflow:hidden}
.results{
  width:330px;flex:0 0 330px;min-width:0;display:flex;flex-direction:column;
  background:var(--paper);border-right:1px solid var(--line);
}
.res-head{
  padding:7px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;
  font-size:11.5px;color:var(--ink-3);background:#FBFAF6;flex:0 0 auto;
}
.res-list{flex:1 1 auto;overflow-y:auto;min-height:0}
.result{
  display:block;width:100%;text-align:left;background:transparent;border:0;
  border-bottom:1px solid var(--line);border-left:2px solid transparent;padding:8px 12px 9px;
}
.result:hover{background:#FBFAF7}
.result[aria-current="true"]{background:var(--accent-soft);border-left-color:var(--accent)}
.r-top{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.r-doc{font-size:11.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-top .chip{margin-left:auto}
.r-sec{font-family:var(--serif);font-size:14px;font-weight:600;display:block;margin-bottom:3px;line-height:1.45}
.r-snip{
  display:block;font-size:12.5px;color:var(--ink-2);line-height:1.7;overflow-wrap:anywhere;
  font-family:var(--serif);
}
.r-snip mark{background:#EDE7D3;color:var(--ink);padding:0 1px;border-radius:2px}
.r-meta{display:flex;align-items:center;gap:7px;margin-top:5px;font-size:11px;color:var(--ink-3);flex-wrap:wrap}
.r-meta .state{margin-left:auto}
.empty{padding:22px 16px;text-align:center;color:var(--ink-3);font-size:12.5px;line-height:1.8}
.empty strong{display:block;color:var(--ink-2);font-size:13.5px;margin-bottom:4px;font-family:var(--serif)}
.res-foot{flex:0 0 auto;border-top:1px solid var(--line);padding:6px 12px;font-size:11px;color:var(--ink-3);background:#FBFAF6}

/* 阅读区 */
.reader{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;min-height:0;background:var(--ivory)}
.rd-head{
  flex:0 0 auto;background:var(--paper);border-bottom:1px solid var(--line);
  padding:9px 14px;display:flex;align-items:flex-start;gap:10px;
}
.rd-doc{font-family:var(--serif);font-size:15px;font-weight:600;line-height:1.45}
.rd-sub{font-size:11.5px;color:var(--ink-3);margin-top:2px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.tabs{flex:0 0 auto;display:flex;gap:2px;padding:0 14px;background:var(--paper);border-bottom:1px solid var(--line)}
.tab{
  border:0;background:transparent;padding:7px 11px 6px;font-size:13px;color:var(--ink-2);
  border-bottom:2px solid transparent;border-radius:0;
}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--accent-2);border-bottom-color:var(--accent);font-weight:600}
.panel{flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column}
.scan-bar{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:5px 14px;border-bottom:1px solid var(--line);background:#FBFAF6;font-size:11.5px;color:var(--ink-3);
}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--radius);overflow:hidden}
.seg button{border:0;background:var(--paper);padding:2px 9px;font-size:11.5px;color:var(--ink-2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-2);font-weight:600}
.scan-scroll{
  flex:1 1 auto;min-height:0;overflow:auto;background:#EDEBE4;padding:12px;
}
.scan-img{
  display:block;margin:0 auto;background:#fff;box-shadow:0 1px 6px rgba(37,42,39,.18);
  width:100%;height:auto;
}
.scan-actual .scan-img{max-width:none;width:auto}
.scan-note{
  flex:0 0 auto;border-top:1px solid var(--line);background:var(--paper);
  padding:6px 14px;font-size:11.5px;color:var(--ink-3);line-height:1.7;
}
.scan-ph{
  margin:14px;padding:22px 18px;border:1px dashed var(--line-2);border-radius:var(--radius);
  background:var(--paper);text-align:center;color:var(--ink-3);font-size:12.5px;line-height:1.9;
}
.scan-ph b{display:block;color:var(--ink-2);font-size:13.5px;font-family:var(--serif);margin-bottom:4px}
.ocr-wrap{flex:1 1 auto;overflow-y:auto;padding:16px 20px;background:var(--paper)}
.ocr-wrap h3,.ocr-h{
  font-family:var(--serif);font-size:14.5px;font-weight:600;margin:14px 0 6px;color:var(--ink);
}
.ocr-wrap h3:first-child{margin-top:0}
.ocr-p{font-family:var(--serif);font-size:14.5px;line-height:2.05;color:var(--ink);margin:0 0 10px;text-indent:2em;overflow-wrap:anywhere}
.ocr-p.raw{text-indent:0;text-align:center;color:var(--ink-3);font-size:12.5px}
.ocr-p mark{background:#EDE7D3;padding:0 2px;border-radius:2px}
.ocr-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.cmp{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1.02fr) minmax(0,1fr);overflow:hidden}
.cmp-col{min-width:0;display:flex;flex-direction:column;min-height:0;background:var(--paper)}
.cmp-col + .cmp-col{border-left:1px solid var(--line)}
.cmp-head{
  flex:0 0 auto;padding:6px 12px;border-bottom:1px solid var(--line);background:#FBFAF6;
  font-size:11.5px;color:var(--ink-3);display:flex;gap:7px;align-items:center;
}
.cmp-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;padding:0}
.cmp-scroll .scan-scroll{flex:0 0 auto;overflow:visible;min-height:0;padding:10px}
.cmp-scroll .ocr-wrap{padding:14px 16px}
.cmp-text-scroll{flex:1 1 auto;min-height:0;overflow-y:auto}
.note-box{
  flex:0 0 auto;border-top:1px solid var(--line);background:#FBFAF6;padding:8px 12px;
}
.note-box h4{font-size:11.5px;color:var(--ink-2);margin-bottom:4px;display:flex;gap:6px;align-items:center}
.note-list{margin:0 0 6px;padding:0;list-style:none;font-size:11.5px;color:var(--ink-2);line-height:1.75}
.note-list li{padding-left:12px;position:relative}
.note-list li::before{content:"·";position:absolute;left:3px;color:var(--accent)}
.note-box textarea{width:100%;font-size:12px}
.note-acts{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
.srcbar{
  flex:0 0 auto;background:var(--paper);border-top:1px solid var(--line);padding:7px 14px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.src-info{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.src-hint{color:var(--ink-3);font-size:11.5px}
.src-acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}

/* ---------- 通用内容视图 ---------- */
.view{padding:14px 16px 22px;max-width:1180px;width:100%}
.view-head{margin-bottom:12px}
.view-head h2{font-family:var(--serif);font-size:16px;font-weight:600}
.view-head p{font-size:12px;color:var(--ink-3);margin-top:3px;line-height:1.75}
.note-strip{
  display:flex;gap:7px;align-items:flex-start;font-size:11.5px;color:var(--ink-2);line-height:1.7;
  background:var(--ochre-soft);border:1px solid #EDE1C8;border-radius:var(--radius);padding:7px 10px;margin-bottom:12px;
}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:12px}
.card-head{padding:8px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.card-head .sub{font-weight:400;font-size:11.5px;color:var(--ink-3)}
.card-body{padding:12px}
.ex-row{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.ex-row:last-child{border-bottom:0}
.ex-main{flex:1 1 auto;min-width:0}
.ex-quote{font-family:var(--serif);font-size:14px;line-height:1.85;overflow-wrap:anywhere}
.ex-meta{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:6px;font-size:11.5px;color:var(--ink-3)}
.ex-acts{flex:0 0 auto;display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:flex-end;max-width:190px}
.job{padding:10px 14px;border-bottom:1px solid var(--line)}
.job:last-child{border-bottom:0}
.job-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.job-name{font-size:13.5px;font-weight:600}
.bar{height:5px;border:1px solid var(--line);border-radius:20px;background:#F0EEE7;overflow:hidden;margin:8px 0 6px;display:flex}
.bar i{display:block;height:100%;background:var(--accent)}
.bar i.b-pend{background:#D9D3C4}
.bar i.b-fail{background:var(--rust)}
.bar i.b-done{background:var(--accent)}
.job-stats{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-3)}
.job-acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.proj{padding:11px 14px;border-bottom:1px solid var(--line)}
.proj:last-child{border-bottom:0}
.proj-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.proj-name{font-family:var(--serif);font-size:14.5px;font-weight:600}
.proj-q{font-size:12.5px;color:var(--ink-2);margin-top:5px;line-height:1.7}
.plan-list{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.plan{font-size:11.5px;border:1px dashed var(--line-2);border-radius:20px;padding:1px 8px;color:var(--ink-2);background:#FBFAF7}
.kv{display:grid;grid-template-columns:112px minmax(0,1fr);gap:7px 12px;font-size:12.5px;align-items:start}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;overflow-wrap:anywhere}
.grid-2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}

/* ---------- 抽屉 ---------- */
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:352px;max-width:100%;background:var(--paper);
  border-left:1px solid var(--line-2);box-shadow:-6px 0 18px rgba(37,42,39,.07);
  display:flex;flex-direction:column;z-index:40;
}
.drawer[hidden]{display:none}
.dr-head{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:8px;background:#FBFAF6}
.dr-head h2{font-size:14px;font-weight:600}
.dr-note{font-size:11.5px;color:var(--ochre);margin-top:2px}
.dr-body{flex:1 1 auto;overflow-y:auto;padding:12px 14px 20px}
.dr-body section{margin-bottom:16px}
.dr-body h3{font-size:11.5px;color:var(--ink-3);letter-spacing:.05em;margin-bottom:6px;font-weight:600}
.dr-list li{font-size:12.5px;color:var(--ink-2);line-height:1.7;padding:6px 0;border-bottom:1px dashed var(--line)}
.dr-list li:last-child{border-bottom:0}
.dr-list .ev{display:inline-block;margin-top:3px;font-size:11.5px;color:var(--accent-2);border:1px solid #C3D0C6;background:var(--accent-soft);border-radius:var(--radius);padding:1px 7px}
.dr-list .ev:hover{background:#E4EBE5}
.ans{border:1px solid var(--line);border-radius:var(--radius);background:#FBFAF7;padding:10px 11px;font-size:12.5px;line-height:1.8}
.ans ol{margin:6px 0 0;padding-left:18px;list-style:decimal}
.ans li{margin-bottom:7px}
.ans .lead{font-size:11.5px;color:var(--ink-3)}
.ans .adv{margin-top:8px;padding-top:7px;border-top:1px solid var(--line);color:var(--ink-2);font-size:12px}
.scrim{position:fixed;inset:0;background:rgba(37,42,39,.28);z-index:35}
.scrim[hidden]{display:none}

/* ---------- 对话框 ---------- */
.modal{
  border:1px solid var(--line-2);border-radius:8px;padding:0;width:min(520px,calc(100vw - 24px));
  background:var(--paper);color:var(--ink);box-shadow:0 10px 30px rgba(37,42,39,.2);
}
.modal::backdrop{background:rgba(37,42,39,.35)}
.modal-head{display:flex;align-items:flex-start;gap:10px;padding:12px 14px 10px;border-bottom:1px solid var(--line);margin:0}
.modal-head h2{font-size:14.5px;font-weight:600;font-family:var(--serif)}
.modal-note{font-size:11.5px;color:var(--ink-3);margin-top:3px;line-height:1.7}
.icon-btn{
  margin-left:auto;border:1px solid var(--line-2);background:var(--paper);border-radius:var(--radius);
  width:26px;height:26px;line-height:1;display:flex;align-items:center;justify-content:center;color:var(--ink-2);flex:0 0 auto;
}
.icon-btn:hover{background:#F4F2EC}
.modal-body{padding:14px}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;padding:10px 14px 13px;flex-wrap:wrap}
.quote-box{
  font-family:var(--serif);font-size:13.5px;line-height:1.95;background:#FBFAF7;border:1px solid var(--line);
  border-radius:var(--radius);padding:9px 11px;max-height:170px;overflow:auto;
}
.file-pick{border:1px dashed var(--line-2);border-radius:var(--radius);padding:10px 11px;background:#FBFAF7;font-size:12.5px;line-height:1.8}
.file-pick .fname{font-family:var(--serif);font-size:13.5px;color:var(--ink)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;background:#F4F2EC;border-radius:3px;padding:0 4px}

/* ---------- 提示条 ---------- */
.toast{
  position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;
  background:#2F3833;color:#F3F2EE;border:1px solid #46524B;border-radius:var(--radius);
  padding:8px 12px;font-size:12.5px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  box-shadow:0 6px 18px rgba(37,42,39,.25);max-width:calc(100vw - 24px);
}
.toast[hidden]{display:none}
.toast .t-btn{border:1px solid #6C7A71;background:transparent;color:#F3F2EE;border-radius:4px;padding:1px 8px;font-size:12px}
.toast .t-btn:hover{background:#3C4841}
.toast .t-close{border:0;background:transparent;color:#C9D1CB;font-size:14px;line-height:1;padding:0 2px}

/* ---------- 响应式 ---------- */
.only-sm{display:none}
@media (max-width:1180px){
  .results{width:296px;flex-basis:296px}
}
@media (max-width:1024px){
  :root{--sidebar:52px}
  .brand{padding:10px 0;text-align:center}
  .brand-row{justify-content:center}
  .brand-name,.brand-sub,.nav-item span.lbl,.nav-badge,.side-foot p:not(.foot-state){display:none}
  .nav-item{justify-content:center;padding:7px 0}
  .nav-idx{width:auto;font-size:12px}
  .side-foot{text-align:center;padding:8px 4px}
  .foot-state{justify-content:center}
  .cmp{grid-template-columns:minmax(0,1fr);overflow-y:auto}
  .cmp-col + .cmp-col{border-left:0;border-top:1px solid var(--line)}
  .cmp-scroll{max-height:44vh}
  .grid-2{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:850px){
  .only-sm{display:inline-flex}
  .app{flex-direction:column}
  .sidebar{
    width:100%;flex:0 0 auto;border-right:0;border-bottom:1px solid var(--line);
    flex-direction:row;align-items:center;gap:6px;padding:6px 8px;overflow-x:auto;
  }
  .brand{border-bottom:0;padding:0 8px 0 2px;flex:0 0 auto}
  .brand-name{display:block;font-size:14px}
  .nav{flex-direction:row;padding:0;gap:4px;overflow-x:auto;flex:1 1 auto;min-width:0}
  .nav-item{width:auto;flex:0 0 auto;white-space:nowrap;min-height:44px;padding:7px 9px}
  .nav-item[aria-current="page"]{border-left-color:var(--line);border-bottom:2px solid var(--accent)}
  .nav-item span.lbl{display:inline;font-size:13px}
  .side-foot{display:none}
  .split{overflow-y:auto;display:block}
  .split[data-pane="list"] .reader{display:none}
  .split[data-pane="detail"] .results{display:none}
  .results{width:100%;flex:1 1 auto;border-right:0}
  .res-list{overflow-y:visible}
  .reader{min-height:auto}
  .panel{overflow-y:visible}
  .scan-scroll{max-height:52vh;overflow:auto}
  .ocr-wrap{overflow-y:visible}
  .cmp-scroll{max-height:none}
  .cmp-text-scroll{overflow-y:visible}
  .view{padding:12px 12px 20px}
  .ex-row{flex-direction:column;gap:8px}
  .ex-acts{max-width:none;justify-content:flex-start}
  .kv{grid-template-columns:minmax(0,1fr);gap:2px 0}
  .kv dt{margin-top:6px}
  .drawer{width:100%}
  .search-head{padding:8px 12px}
}
@media (max-width:560px){
  .topbar{padding:7px 12px;flex-wrap:wrap}
  .topbar .sub{display:none}
  .search-field{flex:1 1 100%}
  .srcbar .src-acts{margin-left:0;width:100%}
  .srcbar .src-acts .btn{flex:1 1 auto}
  .modal-body{padding:12px}
  .rd-doc{font-size:14px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>

    <main class="workspace" id="main"></main>
  </div>
</div>

<!-- 研究助手抽屉 -->
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" aria-label="研究助手（AI 模拟）" hidden></aside>

<!-- 通用对话框 -->
<dialog class="modal" id="modal" aria-labelledby="modal-title">

    <div style="min-width:0">
      <h2 id="modal-title">对话框</h2>
      <p class="modal-note" id="modal-note"></p>
    </div>
    <button class="icon-btn" value="close" aria-label="关闭对话框" type="submit">✕</button>
  </form>
  <div class="modal-body" id="modal-body"></div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite" hidden>
  <span id="toast-msg"></span>

  <button class="t-close" type="button" data-act="toast-close" aria-label="关闭提示">✕</button>

      return {
        lead: '模拟生成 · 未调用任何模型服务',
        points: [
          { t: '安康县志 文件第 7 页（印刷 775）设有「二、文庙」专条：元代建筑，现存大成殿一座，主厅阔 4.66 米。', rec: 'u-ak-7' },
          { t: '汉中地区文化文物志 文件第 4 页（印刷 738）未出现「文庙」字样，扩展检索把它作为「诸葛庙（武侯祠）」的演示相关项返回。', rec: 'u-hz-4' },
          { t: '随州、襄樊两处文庙条目的示例置信度较低，建议先保存摘录，再对照扫描页核验。', rec: 'u-sz-9' }

  function render() {
    document.body.classList.toggle('dense', state.settings.density === 'compact');
    var meta = VIEW_META[state.view];
    $('#view-title').textContent = meta.title;
    $('#view-sub').textContent = meta.sub;
    renderNav();

    var main = $('#main');
    main.className = 'workspace ' + (state.view === 'search' ? 'view-search' : 'view-scroll');
    if (state.view === 'search') main.innerHTML = renderSearch();
    else if (state.view === 'library') main.innerHTML = viewLibrary();
    else if (state.view === 'jobs') main.innerHTML = viewJobs();
    else if (state.view === 'excerpts') main.innerHTML = viewExcerpts();
    else if (state.view === 'projects') main.innerHTML = viewProjects();
    else main.innerHTML = viewSettings();

    var drawer = $('#drawer'), scrim = $('#scrim');
    if (state.drawer) {
      drawer.innerHTML = renderDrawer();
      drawer.hidden = false;
      scrim.hidden = false;
    } else {
      drawer.hidden = true;
      scrim.hidden = true;
      drawer.innerHTML = '';
    }
  }

  function rerenderPreservingScroll() {
    var list = document.querySelector('.res-list');

    var l2 = document.querySelector('.res-list');

  /* ==========================================================

  function runSearch(mode, keepQuery) {
    if (!keepQuery && $('#q')) state.query = $('#q').value.trim();
    state.mode = mode;
    state.pane = 'list';
    var res = computeResults();
    if (res.length) {
      state.selected = res[0].rec.id;
      state.tab = res[0].rec.image ? 'scan' : 'ocr';
    }
    rerenderPreservingScroll();
  }

  function gotoRecord(id) {
    if (!recOf(id)) return;
    state.view = 'search';
    state.selected = id;
    state.tab = 'scan';
    state.pane = 'detail';
    state.drawer = false;
    hideToast();
    render();
  }

  var lastModalRec = null;
  document.addEventListener('click', function (ev) {
    var t = ev.target.closest ? ev.target.closest('[data-act]') : null;
    if (!t) return;
    var act = t.getAttribute('data-act');
    var id = t.getAttribute('data-id');

    switch (act) {
      case 'nav':
        state.view = t.getAttribute('data-view');
        state.drawer = false;
        render();
        $('#main').scrollTop = 0;
        break;

      case 'search-literal': runSearch('literal'); break;
      case 'search-semantic':
        runSearch('expanded');
        toast('别名扩展为演示结果：仅对预置检索词有效，未调用模型。');
        break;
      case 'search-reset':
        state.query = '文庙'; state.scope = 'all'; state.kind = 'all'; state.status = 'all';
        runSearch('literal', true);
        break;

      case 'select':
        state.selected = id;
        state.tab = recOf(id) && recOf(id).image ? 'scan' : 'ocr';
        state.pane = 'detail';
        rerenderPreservingScroll();
        break;

      case 'back': state.pane = 'list'; rerenderPreservingScroll(); break;

      case 'tab':
        state.tab = t.getAttribute('data-tab');
        rerenderPreservingScroll();
        break;
      case 'zoom':
        state.zoom = t.getAttribute('data-zoom');
        rerenderPreservingScroll();
        break;

      case 'toggle-ver': {
        var r = recOf(state.selected);
        if (!r) break;
        state.unitVer[r.id] = verOf(r) === 'accepted' ? 'pending' : 'accepted';
        rerenderPreservingScroll();
        toast(state.unitVer[r.id] === 'accepted' ? '已标记为已核验（仅本次演示会话）。' : '已撤销核验标记。');
        break;
      }

      case 'save-ex': {
        var rec = recOf(state.selected);
        if (rec) { lastModalRec = rec.id; dialogExcerpt(rec); }
        break;
      }
      case 'ex-confirm': {
        var rc = recOf(id);
        var qEl = $('#ex-quote'), cEl = $('#ex-cat'), nEl = $('#ex-note');
        var text = rc && qEl ? qEl.textContent.trim() : '';
        if (!text) { toast('摘录为空，请先选择一段原文。'); break; }
        state.excerpts.push({
          id: nextId('ex'), rec: id, quote: text,
          cat: cEl ? cEl.value : '待归类',
          note: nEl ? nEl.value.trim() : '',
          ver: 'pending', at: '2026-10-15 09:24'
        });
        closeModal();
        toast('已保存到摘录集（演示）。可在「摘录集」中核验或删除。');
        render();
        break;
      }

      case 'save-corr': {
        var rr = recOf(state.selected);
        var ta = document.getElementById('corr');
        if (!rr || !ta) break;
        state.corrections[rr.id] = ta.value.trim();
        var n = 0;
        state.excerpts.forEach(function (x) { if (x.rec === rr.id && x.ver !== 'stale') { x.ver = 'stale'; n += 1; } });
        render();
        toast('备注已存在本次演示会话；' + (n ? n + ' 条相关摘录标记为「已变更」。' : '没有相关摘录需要复核。'));
        break;
      }

      case 'ex-review': {
        for (var i = 0; i < state.excerpts.length; i++) {
          if (state.excerpts[i].id === id) {
            state.excerpts[i].ver = state.excerpts[i].ver === 'accepted' ? 'pending' : 'accepted';
          }
        }
        render();
        break;
      }
      case 'ex-src': {
        for (var k = 0; k < state.excerpts.length; k++) {
          if (state.excerpts[k].id === id) { gotoRecord(state.excerpts[k].rec); break; }
        }
        break;
      }
      case 'ex-del': dialogDelete(id); break;
      case 'del-confirm': {
        var idx = -1;
        for (var m = 0; m < state.excerpts.length; m++) { if (state.excerpts[m].id === id) idx = m; }
        if (idx >= 0) { lastDeleted = state.excerpts.splice(idx, 1)[0]; }
        closeModal();
        render();
        toast('已删除摘录。', '撤销');
        break;
      }
      case 'toast-undo':
        if (lastDeleted) { state.excerpts.push(lastDeleted); lastDeleted = null; hideToast(); render(); }
        break;
      case 'toast-close': hideToast(); break;

      case 'drawer-open': state.drawer = true; render(); $('#drawer').querySelector('textarea').focus(); break;
      case 'drawer-close': state.drawer = false; render(); break;
      case 'scrim': state.drawer = false; render(); break;

      case 'goto': gotoRecord(id); break;

      case 'ask-run': {
        var ai = document.getElementById('ask');
        state.ask.q = ai ? ai.value : '';
        state.ask.a = simulatedAnswer(state.ask.q);
        if (!state.ask.a) { toast('请先输入一个问题。'); break; }
        render();
        var again = document.getElementById('ask');
        if (again) again.focus();
        break;
      }

      case 'about': dialogAbout(); break;
      case 'modal-close': closeModal(); break;

      case 'lib-open': {
        state.view = 'search';
        state.scope = t.getAttribute('data-doc');
        state.mode = 'literal';
        var r2 = computeResults();
        if (r2.length) { state.selected = r2[0].rec.id; state.tab = r2[0].rec.image ? 'scan' : 'ocr'; }
        state.pane = 'list';
        render();
        break;
      }
      case 'import-open': pendingFile = null; dialogImport(); break;
      case 'import-pick': {
        var fi = document.getElementById('import-file');
        if (fi) fi.click();
        break;
      }
      case 'import-sample':
        pendingFile = { name: '示例_地方志摘录.pdf', size: 4823140 };
        refreshImport();
        break;
      case 'import-confirm': {
        if (!pendingFile) break;
        var modeEl = document.querySelector('input[name="imode"]:checked');
        var mode = modeEl ? modeEl.value : 'auto';
        var kindLabel = mode === 'text' ? '文本层' : '扫描件';
        state.files.unshift({
          id: nextId('f'), name: pendingFile.name, doc: null,
          kind: mode === 'text' ? 'text' : 'scan',
          pages: '—', done: '—', status: '演示待导入',
          at: '2026-10-15 09:26', demo: true
        });
        closeModal();
        toast('已加入演示清单（' + kindLabel + '）。未读取内容、未上传、未联网。');
        render();
        pendingFile = null;
        break;
      }

      case 'job-toggle': {
        for (var a1 = 0; a1 < state.jobs.length; a1++) {
          if (state.jobs[a1].id === id) state.jobs[a1].paused = !state.jobs[a1].paused;
        }
        render();
        toast('已改变演示状态，未启动任何识别进程。');
        break;
      }
      case 'job-retry': {
        for (var a2 = 0; a2 < state.jobs.length; a2++) {
          if (state.jobs[a2].id === id) {
            var f = state.jobs[a2].fail;
            if (!f) break;
            state.jobs[a2].fail = 0;
            state.jobs[a2].pend += f;
            state.jobs[a2].paused = false;
            toast('模拟重试：' + f + ' 页重新排队（未真正运行）。');
          }
        }
        render();
        break;
      }

      case 'proj-open': {
        var pid = t.getAttribute('data-id');
        state.projOpen = state.projOpen === pid ? null : pid;
        render();
        break;
      }
      case 'proj-search': {
        state.view = 'search';
        state.query = t.getAttribute('data-kw') || '';
        state.mode = 'literal';
        state.scope = 'all'; state.kind = 'all'; state.status = 'all';
        var r3 = computeResults();
        if (r3.length) { state.selected = r3[0].rec.id; state.tab = r3[0].rec.image ? 'scan' : 'ocr'; }
        state.pane = 'list';
        render();
        break;
      }

      case 'set-save': {
        var url = $('#s-url').value.trim();
        var model = $('#s-model').value.trim();
        var eb = $('#s-env-base').value.trim();
        var em = $('#s-env-model').value.trim();
        if (!/^https?:\/\/.+/.test(url)) {
          toast('服务地址需以 http:// 或 https:// 开头（演示校验，不发送请求）。');
          break;
        }
        if (!model) { toast('请填写模型名称。'); break; }
        if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(eb) || !/^[A-Za-z_][A-Za-z0-9_]*$/.test(em)) {
          toast('环境变量名只能使用字母、数字与下划线，且不能以数字开头。');
          break;
        }
        state.settings.baseUrl = url; state.settings.model = model;
        state.settings.envBase = eb; state.settings.envModel = em;
        render();
        toast('已保存到本次演示会话（未写入文件，未发送请求）。');
        break;
      }
      case 'set-reset':
        state.settings.baseUrl = 'http://localhost:11434/v1';
        state.settings.model = 'qwen2.5:7b';
        state.settings.envBase = 'LIT_LLM_BASE_URL';
        state.settings.envModel = 'LIT_LLM_MODEL';
        render();
        toast('已恢复默认设置（演示）。');
        break;

      case 'session-reset':
        openModal({
          title: '恢复演示初始状态？',
          note: '会把摘录、识别任务、文献清单与设置恢复到打开页面时的样子。',
          body: '<div class="modal-foot">' +
            '<button class="btn" type="button" data-act="modal-close">取消</button>' +
            '<button class="btn btn-danger" type="button" data-act="session-confirm">恢复</button></div>'
        });
        break;
      case 'session-confirm': {
        state.excerpts = SEED_EXCERPTS.slice();
        state.files = SEED_FILES.slice();
        state.jobs = SEED_JOBS.slice();
        state.corrections = {}; state.unitVer = {};
        state.settings.baseUrl = 'http://localhost:11434/v1';
        state.settings.model = 'qwen2.5:7b';
        state.settings.envBase = 'LIT_LLM_BASE_URL';
        state.settings.envModel = 'LIT_LLM_MODEL';
        state.settings.density = 'normal';
        state.view = 'search'; state.query = '文庙'; state.mode = 'literal';
        state.scope = 'all'; state.kind = 'all'; state.status = 'all';
        state.selected = 'u-ak-7'; state.tab = 'scan'; state.pane = 'list';
        state.ask = { q: '', a: null }; state.projOpen = null;
        closeModal(); hideToast();
        render();
        toast('已恢复演示初始状态。');
        break;
      }
      default: break;
    }
  });

  /* 回车检索 / 筛选与设置项 */
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' && ev.target && ev.target.id === 'q') { ev.preventDefault(); runSearch('literal'); }
    if (ev.key === 'Enter' && ev.target && ev.target.id === 's-density') { ev.preventDefault(); }
    if (ev.key === 'Enter' && ev.target && ev.target.id === 'ask') { ev.preventDefault(); t('ask-run'); }
    /* Tab 键顺序：左右方向键切换阅读方式 */
    if ((ev.key === 'ArrowRight' || ev.key === 'ArrowLeft') && ev.target && ev.target.classList &&
        ev.target.classList.contains('tab')) {
      ev.preventDefault();
      var order = ['scan', 'ocr', 'cmp'];
      var i = order.indexOf(state.tab);
      var next = order[(i + (ev.key === 'ArrowRight' ? 1 : order.length - 1)) % order.length];
      state.tab = next;
      rerenderPreservingScroll();
      var nb = document.getElementById('tab-' + next);
      if (nb) nb.focus();
    }
    if (ev.key === 'Escape' && state.drawer) { state.drawer = false; render(); }
  });

  function t(act) {
    var b = document.querySelector('[data-act="' + act + '"]');
    if (b) b.click();
  }

  document.addEventListener('change', function (ev) {
    var el = ev.target;
    var act = el.getAttribute && el.getAttribute('data-act');
    if (act === 'f-scope') { state.scope = el.value; rerenderPreservingScroll(); }
    else if (act === 'f-kind') { state.kind = el.value; rerenderPreservingScroll(); }
    else if (act === 'f-status') { state.status = el.value; rerenderPreservingScroll(); }
    else if (act === 'x-status') { state.exStatus = el.value; render(); }
    else if (act === 'x-doc') { state.exDoc = el.value; render(); }
    else if (act === 's-density') { state.settings.density = el.value; render(); }
    else if (el.id === 'import-file' && el.files && el.files[0]) {
      pendingFile = { name: el.files[0].name, size: el.files[0].size };
      refreshImport();
    }
  });

  /* 抽屉遮罩 */
  $('#scrim').addEventListener('click', function () { state.drawer = false; render(); });

  /* 紧凑密度 */
  var st = document.createElement('style');
  st.textContent = '.dense{line-height:1.45}.dense .result{padding:6px 12px 7px}.dense .ex-row{padding:8px 14px}.dense .ocr-p{line-height:1.85;margin-bottom:7px}';
  document.head.appendChild(st);

  render();
})();
</script>
</body>
</html>
