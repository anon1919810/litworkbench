<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="文献案头（暂定名）设计草图：本地文献检索、原页对读、摘录与研究项目。全部数据为演示，不连接真实文献库。">
<meta name="color-scheme" content="light">
<title>个人图书馆 · Notion 样式草图</title>
<style>
/* ============================================================
   文献案头 · 界面草图（Notion 风格工作区）
   底色 #F7F7F5 / 画布 #FFF / 文字 #37352F / 次级 #9B9A97
   分隔线 #E9E9E7 / 悬停 #EBEBEA / 主操作 #2383E2
   全部使用系统无衬线字体，无外部资源、无网络请求
   ============================================================ */
:root{
  --bg:#F7F7F5;
  --canvas:#FFFFFF;
  --text:#37352F;
  --text-2:#9B9A97;
  --text-3:#6B6A67;
  --line:#E9E9E7;
  --hover:#EBEBEA;
  --blue:#2383E2;
  --blue-2:#1B72C5;
  --blue-soft:#D3E5EF;
  --gray-tag:#F1F1EF;
  --yellow-tag:#FBF3DB;
  --mark:#FBEFC6;
  --sb:240px;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","Noto Sans SC","PingFang SC","Hiragino Sans GB",Helvetica,Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--canvas);color:var(--text);
  font:400 14px/1.5 var(--ui);-webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,p,ul,ol,figure,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
svg{display:block}
:focus-visible{outline:2px solid var(--blue);outline-offset:1px;border-radius:3px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;left:-9999px}
.skip{position:absolute;left:-9999px}
.skip:focus{left:8px;top:8px;z-index:99;background:#fff;padding:6px 10px;border-radius:3px;box-shadow:0 0 0 2px var(--blue)}
mark{background:var(--mark);color:inherit;padding:0 1px;border-radius:2px}

/* ---------------- 外壳 ---------------- */
.app{display:flex;height:100%;min-height:0}
.col{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;min-height:0}
.workspace{flex:1 1 auto;min-height:0;min-width:0;display:flex;flex-direction:column;overflow-y:auto}
.workspace.view-search{overflow:hidden}

/* ---------------- 侧栏 ---------------- */
.sidebar{
  width:var(--sb);flex:0 0 var(--sb);background:var(--bg);
  border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:30;
}
.ws-btn{display:flex;align-items:center;gap:8px;width:calc(100% - 16px);margin:8px 8px 2px;padding:4px 6px;border-radius:4px;text-align:left}
.ws-btn:hover{background:var(--hover)}
.ws-avatar{width:20px;height:20px;border-radius:3px;background:var(--text);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.ws-name{font-size:14.5px;font-weight:600;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{color:var(--text-2);flex:0 0 auto}
.sb-scroll{flex:1 1 auto;overflow-y:auto;padding:2px 8px 10px;min-height:0}
.sb-group{font-size:11.5px;color:var(--text-2);padding:12px 8px 4px;font-weight:500}
.nav-item{
  display:flex;align-items:center;gap:8px;width:100%;padding:5px 8px;border-radius:3px;
  font-size:14px;color:var(--text);text-align:left;
}
.nav-item:hover{background:var(--hover)}
.nav-item[aria-current="page"]{background:var(--hover);font-weight:600}
.nav-ico{color:#73726E;flex:0 0 auto}
.nav-txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-badge{margin-left:auto;font-size:11.5px;color:var(--text-2);flex:0 0 auto}
.nav-item.sub{padding-left:26px;font-size:13.5px;color:var(--text-3)}
.sb-foot{border-top:1px solid var(--line);padding:6px 8px 8px}
.sb-row{display:flex;align-items:center;gap:8px;width:100%;padding:5px 8px;border-radius:3px;font-size:13.5px;color:var(--text);text-align:left}
.sb-row:hover{background:var(--hover)}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--blue);flex:0 0 auto}
.prev-tag{font-size:11px;color:var(--text-2);border:1px solid var(--line);border-radius:3px;padding:0 5px;background:#fff;flex:0 0 auto}
.sb-muted{font-size:12px;color:var(--text-2);padding:2px 8px}

/* ---------------- 顶栏 ---------------- */
.topbar{
  height:45px;flex:0 0 45px;display:flex;align-items:center;gap:10px;
  padding:0 10px 0 14px;background:var(--canvas);border-bottom:1px solid var(--line);
}
.crumbs{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--text-2);min-width:0}
.crumb-cur{color:var(--text);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:6px;min-width:0}
.tb-btn{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:3px;font-size:13.5px;color:var(--text);white-space:nowrap}
.tb-btn:hover{background:var(--hover)}
.tb-icon{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:3px;color:#73726E}
.tb-icon:hover{background:var(--hover)}
.tb-preview{font-size:11.5px;color:var(--text-2);white-space:nowrap}
.tb-menu{display:none;width:28px;height:28px;align-items:center;justify-content:center;border-radius:3px;color:#73726E}

/* ---------------- 页面头 ---------------- */
.page{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
.page-head{padding:34px 40px 6px}
.page-head.sm{padding:22px 40px 4px}
.page-icon{width:32px;height:32px;color:var(--text);margin-bottom:8px}
.page-icon svg{width:100%;height:100%}
.page-head.sm .page-icon{width:26px;height:26px;margin-bottom:6px}
.page-title{font-size:32px;line-height:1.2;font-weight:700;letter-spacing:-.01em}
.page-head.sm .page-title{font-size:28px}
.page-desc{margin-top:6px;font-size:14px;line-height:1.65;color:var(--text-2);max-width:820px}
.page-body{padding:0 40px 48px}
.fine-print{font-size:12.5px;line-height:1.75;color:var(--text-2);margin-top:12px;max-width:860px}
.fine-print b{color:var(--text-3);font-weight:500}

/* ---------------- 检索视图头 ---------------- */
.search-row{display:flex;align-items:center;gap:8px;padding:12px 40px 4px;flex-wrap:wrap}
.sfield{display:flex;align-items:center;gap:8px;height:36px;border:1px solid var(--line);border-radius:4px;padding:0 10px;background:#fff;flex:1 1 300px;max-width:440px}
.sfield:focus-within{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.sfield input{border:0;outline:none;flex:1 1 auto;min-width:0;background:transparent;font-size:14px;padding:0}
.sfield input::-webkit-search-cancel-button{cursor:pointer}
.s-hint{font-size:12.5px;color:var(--text-2)}
.viewbar{display:flex;align-items:flex-end;gap:2px;padding:10px 40px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.vtab{position:relative;padding:7px 10px 9px;font-size:14px;color:var(--text-2);border-radius:3px 3px 0 0;white-space:nowrap}
.vtab:hover{color:var(--text);background:var(--hover)}
.vtab[aria-selected="true"]{color:var(--text);font-weight:500}
.vtab[aria-selected="true"]::after{content:"";position:absolute;left:6px;right:6px;bottom:-1px;height:2px;background:var(--text);border-radius:2px}
.vcount{font-size:12.5px;color:var(--text-2);padding:0 10px 9px}
.vfilters{margin-left:auto;display:flex;align-items:center;gap:6px;padding-bottom:7px;flex-wrap:wrap}
.qselect{height:28px;border:1px solid var(--line);border-radius:3px;background:#fff;font-size:13px;padding:0 4px;max-width:170px;cursor:pointer;color:var(--text)}
.qselect:hover{background:var(--hover)}

/* ---------------- 按钮 / 标签 ---------------- */
.btn{
  display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:3px;
  font-size:14px;color:var(--text);background:#fff;border:1px solid rgba(55,53,47,.16);white-space:nowrap;
}
.btn:hover{background:rgba(55,53,47,.06)}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-2);border-color:var(--blue-2)}
.btn-quiet{border-color:transparent;background:transparent}
.btn-quiet:hover{background:var(--hover)}
.btn-sm{height:28px;padding:0 9px;font-size:13px}
.btn[disabled]{opacity:.42;cursor:not-allowed}
.tag{
  display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:18px;padding:0 6px;
  border-radius:3px;background:var(--gray-tag);color:var(--text-3);white-space:nowrap;
}
.tag-blue{background:var(--blue-soft);color:#1F4E79}
.tag-yellow{background:var(--yellow-tag);color:#8A6412}
.tag-red{background:#FBE4E0;color:#9B3B2C}
.tag-gray{background:var(--gray-tag);color:var(--text-3)}
.state::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.65;flex:0 0 auto}
.state.stale::before{border-radius:1px;transform:rotate(45deg)}

/* ---------------- 检索结果 ---------------- */
.split{flex:1 1 auto;min-height:0;min-width:0;display:flex;overflow:hidden}
.results{width:310px;flex:0 0 310px;min-width:0;display:flex;flex-direction:column;border-right:1px solid var(--line);background:#fff}
.res-head{flex:0 0 auto;padding:8px 16px;font-size:12.5px;color:var(--text-2);border-bottom:1px solid var(--line)}
.res-list{flex:1 1 auto;overflow-y:auto;min-height:0}
.result{display:block;width:100%;text-align:left;padding:14px 16px 15px;border-bottom:1px solid var(--line)}
.result:hover{background:var(--bg)}
.result[aria-current="true"]{background:var(--hover)}
.r-title{font-size:15px;font-weight:500;line-height:1.45;display:block}
.r-snip{display:block;margin-top:4px;font-size:13.5px;line-height:1.75;color:var(--text-3);overflow-wrap:anywhere}
.r-meta{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:12px;color:var(--text-2);flex-wrap:wrap}
.r-meta>*:last-child{margin-left:auto}
.res-foot{flex:0 0 auto;padding:8px 16px;font-size:11.5px;color:var(--text-2);border-top:1px solid var(--line);line-height:1.6}
.empty{padding:36px 20px;text-align:left;color:var(--text-2);font-size:13.5px;line-height:1.8}
.empty strong{display:block;color:var(--text);font-size:15px;font-weight:600;margin-bottom:4px}

/* ---------------- 阅读区 ---------------- */
.reader{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;min-height:0;background:#fff}
.doc-head{display:flex;align-items:flex-start;gap:12px;padding:16px 24px 8px}
.doc-title{font-size:20px;font-weight:700;letter-spacing:-.01em;line-height:1.3;overflow-wrap:anywhere}
.doc-sub{font-size:14px;color:var(--text-2);margin-top:3px;overflow-wrap:anywhere}
.doc-acts{margin-left:auto;display:flex;gap:6px;flex:0 0 auto}
.props{padding:4px 24px 12px;border-top:1px solid var(--line);margin-top:4px}
.prop{display:flex;gap:14px;padding:3px 0;font-size:13.5px;align-items:baseline}
.pk{width:64px;flex:0 0 auto;color:var(--text-2);text-align:right}
.pv{min-width:0;overflow-wrap:anywhere}
.source-properties{border-top:1px solid var(--line)}
.source-properties summary{padding:9px 24px;cursor:pointer;font-size:13px;color:var(--text-3);line-height:1.7}
.source-properties summary .tag{margin-left:8px}
.doc-tabs{display:flex;gap:2px;padding:0 24px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.dtab{padding:8px 10px 9px;font-size:13.5px;color:var(--text-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.dtab:hover{color:var(--text)}
.dtab[aria-selected="true"]{color:var(--text);font-weight:500;border-bottom-color:var(--text)}
.panel{flex:1 1 auto;min-height:0;overflow-y:auto}
.scan-bar{display:flex;align-items:center;gap:10px;padding:7px 24px;font-size:12.5px;color:var(--text-2);border-bottom:1px solid var(--line);background:#FBFBFA;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:3px;overflow:hidden;background:#fff}
.seg button{padding:2px 9px;font-size:12px;color:var(--text-2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--hover);color:var(--text)}
.scan-scroll{flex:1 1 auto;min-height:0;overflow:auto;background:#F1F1EF;padding:16px}
.scan-img{display:block;margin:0 auto;background:#fff;box-shadow:0 1px 5px rgba(55,53,47,.18);width:100%;height:auto}
.scan-actual .scan-img{width:auto;max-width:none}
.scan-note{font-size:12px;line-height:1.7;color:var(--text-2);padding:9px 24px;border-top:1px solid var(--line);background:#fff}
.scan-ph{margin:16px 24px;padding:28px 20px;border:1px dashed var(--line);border-radius:6px;background:#FBFBFA;color:var(--text-2);font-size:13.5px;line-height:1.8}
.scan-ph b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}
.read-wrap{padding:22px 28px 44px;max-width:820px}
.read-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.read-p{font-size:16px;line-height:2;margin-bottom:16px;overflow-wrap:anywhere}
.read-h{font-size:16px;font-weight:600;margin:24px 0 8px;line-height:1.5}
.read-raw{font-size:12.5px;color:var(--text-2);text-align:center;margin-bottom:14px}
.cmp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);flex:1 1 auto;min-height:0}
.cmp-col{min-width:0;display:flex;flex-direction:column;min-height:0;background:#fff}
.cmp-col+.cmp-col{border-left:1px solid var(--line)}
.cmp-head{flex:0 0 auto;padding:8px 16px;font-size:12.5px;color:var(--text-2);border-bottom:1px solid var(--line);background:#FBFBFA;display:flex;gap:8px;align-items:center}
.cmp-scroll{flex:1 1 auto;min-height:0;overflow-y:auto}
.cmp-scroll .scan-scroll{flex:0 0 auto;overflow:visible;min-height:0;padding:12px}
.cmp-text{flex:1 1 auto;min-height:0;overflow-y:auto}
.cmp-text .read-wrap{padding:16px 20px 28px}
.note-box{flex:0 0 auto;border-top:1px solid var(--line);padding:10px 16px;background:#FBFBFA}
.note-box h4{font-size:12.5px;color:var(--text-2);margin-bottom:6px;font-weight:500}
.note-list{margin:0 0 8px;list-style:none;font-size:12.5px;color:var(--text-3);line-height:1.75}
.note-list li{padding-left:12px;position:relative}
.note-list li::before{content:"·";position:absolute;left:3px;color:var(--text-2)}
.note-box textarea{width:100%;font-size:13px;line-height:1.7}
.srcbar{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:9px 24px;border-top:1px solid var(--line);flex-wrap:wrap}
.src-info{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--text-2);flex-wrap:wrap}
.src-acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}

/* ---------------- 数据库 / 列表 ---------------- */
.db-toolbar{display:flex;align-items:center;gap:10px;padding:14px 0 8px;flex-wrap:wrap}
.db-name{font-size:14px;font-weight:600}
.db-count{font-size:12.5px;color:var(--text-2)}
.db-right{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tbl-wrap{overflow-x:auto;border-top:1px solid var(--line)}
table.tbl{width:100%;min-width:760px;border-collapse:collapse}
table.tbl td:first-child{min-width:220px}
table.tbl th{text-align:left;font-size:12.5px;font-weight:500;color:var(--text-2);padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:#FBFBFA}
table.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:13.5px}
table.tbl tbody tr:hover{background:var(--bg)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.db-list{border-top:1px solid var(--line)}
.db-row{display:flex;gap:16px;align-items:flex-start;padding:13px 10px;border-bottom:1px solid var(--line)}
.db-row:hover{background:var(--bg)}
.row-main{flex:1 1 auto;min-width:0}
.row-title{font-size:15px;font-weight:500;line-height:1.5;overflow-wrap:anywhere}
.row-sub{font-size:13.5px;color:var(--text-3);line-height:1.7;margin-top:3px;overflow-wrap:anywhere}
.row-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:7px;font-size:12.5px;color:var(--text-2)}
.row-acts{display:flex;gap:6px;align-items:center;flex:0 0 auto;flex-wrap:wrap;justify-content:flex-end}
.bar{height:4px;border-radius:3px;background:#EDEDEB;overflow:hidden;margin:9px 0 7px;display:flex;max-width:520px}
.bar i{display:block;height:100%;background:var(--blue)}
.bar i.b-pend{background:#DCDCDA}
.bar i.b-fail{background:#E06C5A}
.job-line{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--text-2);margin-top:2px}
.kv-l{display:grid;grid-template-columns:92px minmax(0,1fr);gap:8px 16px;font-size:13.5px;align-items:baseline}
.kv-l dt{color:var(--text-2)}

/* ---------------- 设置 ---------------- */
.set-block{margin:0 0 34px;max-width:760px}
.set-h{font-size:15px;font-weight:600;margin-bottom:2px}
.set-sub{font-size:13px;color:var(--text-2);margin-bottom:12px;line-height:1.7}
.set-row{display:flex;gap:24px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.set-label{font-size:14px;flex:0 0 190px}
.set-desc{font-size:12.5px;color:var(--text-2);line-height:1.7;margin-top:3px}
.set-ctl{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
input[type="text"],input[type="url"],input[type="search"],input[type="password"],select,textarea{
  border:1px solid rgba(55,53,47,.16);border-radius:3px;background:#fff;padding:5px 8px;font-size:14px;max-width:100%;
}
input:focus,select:focus,textarea:focus{outline:none;box-shadow:0 0 0 1px var(--blue);border-color:var(--blue)}
.sfield input[type="search"]{border:0;padding:0;background:transparent;box-shadow:none;height:100%}
input[disabled]{background:#F7F7F5;color:var(--text-2);cursor:not-allowed;border-style:dashed}
input[type="file"]{font-size:13px}
textarea{resize:vertical;min-height:64px;line-height:1.7;width:100%}
label.lbl{display:block;font-size:13px;color:var(--text-2);margin-bottom:4px}
.field{margin-bottom:14px}
.help{font-size:12px;color:var(--text-2);line-height:1.7;margin-top:4px}

/* ---------------- 抽屉 ---------------- */
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:360px;max-width:100%;background:#fff;
  border-left:1px solid var(--line);z-index:60;display:flex;flex-direction:column;
  box-shadow:-8px 0 24px rgba(55,53,47,.08);
}
.drawer[hidden]{display:none}
.dr-head{padding:12px 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:10px}
.dr-head h2{font-size:16px;font-weight:600}
.dr-note{font-size:12px;color:var(--text-2);margin-top:2px}
.dr-body{flex:1 1 auto;overflow-y:auto;padding:14px 16px 28px}
.dr-body h3{font-size:12.5px;color:var(--text-2);font-weight:500;margin-bottom:6px}
.dr-body section{margin-bottom:20px}
.dr-list li{font-size:13px;color:var(--text-3);line-height:1.75;padding:7px 0;border-bottom:1px solid var(--line)}
.dr-list li:last-child{border-bottom:0}
.ev{display:inline-block;margin-top:4px;font-size:12.5px;color:var(--blue);text-align:left}
.ev:hover{text-decoration:underline}
.ans{border:1px solid var(--line);border-radius:5px;background:#FBFBFA;padding:12px;font-size:13px;line-height:1.8;color:var(--text-3)}
.ans ol{margin:6px 0 0;padding-left:18px;list-style:decimal}
.ans li{margin-bottom:8px}
.ans .lead{font-size:12px;color:var(--text-2)}
.ans .adv{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.icon-btn{width:26px;height:26px;border-radius:3px;display:flex;align-items:center;justify-content:center;color:var(--text-2);flex:0 0 auto}
.icon-btn:hover{background:var(--hover)}
.scrim{position:fixed;inset:0;background:rgba(55,53,47,.3);z-index:55}
.scrim[hidden]{display:none}
.nav-scrim{position:fixed;inset:0;background:rgba(55,53,47,.3);z-index:29}
.nav-scrim[hidden]{display:none}

/* ---------------- 对话框 ---------------- */
.modal{border:1px solid var(--line);border-radius:6px;padding:0;width:min(520px,calc(100vw - 24px));background:#fff;color:var(--text)}
.modal::backdrop{background:rgba(55,53,47,.35)}
.modal-head{display:flex;align-items:flex-start;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line);margin:0}
.modal-head h2{font-size:16px;font-weight:600}
.modal-note{font-size:12.5px;color:var(--text-2);margin-top:3px;line-height:1.7}
.modal-body{padding:16px}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;padding:4px 0 0;flex-wrap:wrap}
.quote-box{border:1px solid var(--line);border-radius:5px;background:#FBFBFA;padding:10px 12px;max-height:180px;overflow:auto;font-size:14px;line-height:1.95}
.file-pick{border:1px dashed var(--line);border-radius:5px;padding:12px;background:#FBFBFA;font-size:13px;line-height:1.8}
.file-pick .fname{font-weight:600}
fieldset{border:0;padding:0;margin:0}

/* ---------------- 提示条 ---------------- */
.toast{
  position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:80;background:#37352F;color:#fff;
  border-radius:5px;padding:9px 12px;font-size:13px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  max-width:calc(100vw - 24px);
}
.toast[hidden]{display:none}
.t-btn{border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:3px;padding:1px 8px;font-size:12.5px}
.t-btn:hover{background:rgba(255,255,255,.12)}
.t-close{color:#fff;font-size:15px;line-height:1;opacity:.75}
.t-close:hover{opacity:1}

/* ---------------- 响应式 ---------------- */
.only-sm{display:none}
@media (max-width:1180px){
  .results{width:286px;flex-basis:286px}
}
@media (max-width:1024px){
  :root{--sb:200px}
  .page-head,.page-head.sm,.search-row,.viewbar,.page-body{padding-left:28px;padding-right:28px}
  .cmp{grid-template-columns:minmax(0,1fr)}
  .cmp-col+.cmp-col{border-left:0;border-top:1px solid var(--line)}
  .cmp-scroll{max-height:46vh}
  .set-label{flex-basis:160px}
}
@media (max-width:850px){
  .only-sm{display:inline-flex}
  .tb-menu{display:flex}
  .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);box-shadow:none;width:260px;flex-basis:260px}
  body.nav-open .sidebar{transform:none;box-shadow:0 0 24px rgba(55,53,47,.16)}
  .app{flex-direction:row}
  .split{overflow-y:auto;display:block}
  .split[data-pane="list"] .reader{display:none}
  .split[data-pane="detail"] .results{display:none}
  .results{width:100%;flex:1 1 auto;border-right:0}
  .res-list{overflow-y:visible}
  .reader{min-height:auto}
  .panel{overflow-y:visible}
  .scan-scroll{max-height:56vh}
  .cmp-scroll{max-height:none}
  .cmp-text{overflow-y:visible}
  .page-title{font-size:28px}
  .page-head{padding:24px 20px 4px}
  .page-head.sm{padding:18px 20px 4px}
  .search-row,.viewbar,.page-body{padding-left:20px;padding-right:20px}
  .db-row{flex-direction:column;gap:8px}
  .row-acts{justify-content:flex-start}
  .kv-l{grid-template-columns:minmax(0,1fr);gap:2px 0}
  .set-row{flex-direction:column;gap:8px}
  .set-label{flex-basis:auto}
  .drawer{width:100%}
  .srcbar .src-acts{margin-left:0;width:100%}
}
@media (max-width:560px){
  .tb-preview{overflow:hidden;text-overflow:ellipsis;max-width:120px}
  .page-title{font-size:24px}
  .sfield{flex:1 1 100%;max-width:none}
  .vfilters{width:100%;margin-left:0}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

      state.tab = res[0].rec.image ? 'scan' : 'ocr';

    rerenderPreservingScroll();

    hideToast();
    render();

    switch (act) {
      case 'nav':
        state.view = t.getAttribute('data-view');

        state.drawer = false;
        render();
        $('#main').scrollTop = 0;
        break;

      case 'list-view':
        state.listView = t.getAttribute('data-v');

        break;
      case 'menu':
        state.navOpen = !state.navOpen;

        break;

        state.navOpen = false;
        render();
        break;

      case 'search-literal': runSearch('literal'); break;
      case 'search-semantic':

        state.pane = 'detail';
        rerenderPreservingScroll();
        break;

      case 'back': state.pane = 'list'; rerenderPreservingScroll(); break;

      case 'tab':
        state.tab = t.getAttribute('data-tab');

        break;

        rerenderPreservingScroll();
        break;

        break;

        });

        render();
        break;

        var rr = recOf(state.selected);
        var ta = document.getElementById('corr');
        if (!rr || !ta) break;
        state.corrections[rr.id] = ta.value.trim();
        var n = 0;
        state.excerpts.forEach(function (x) { if (x.rec === rr.id && x.ver !== 'stale') { x.ver = 'stale'; n += 1; } });
        render();
        toast('备注已存在本次演示会话；' + (n ? n + ' 条相关摘录标记为「已变更」。' : '没有相关摘录需要复核。'));
        break;

      case 'ex-review': {
        for (var i = 0; i < state.excerpts.length; i++) {

  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' && ev.target && ev.target.id === 'q') { ev.preventDefault(); runSearch('literal'); }
    if (ev.key === 'Enter' && ev.target && ev.target.id === 's-density') { ev.preventDefault(); }
    if (ev.key === 'Enter' && ev.target && ev.target.id === 'ask') { ev.preventDefault(); t('ask-run'); }
    /* Tab 键顺序：左右方向键切换阅读方式 */
    if ((ev.key === 'ArrowRight' || ev.key === 'ArrowLeft') && ev.target && ev.target.classList &&
        ev.target.classList.contains('dtab')) {
      ev.preventDefault();
      var order = ['scan', 'ocr', 'cmp'];
      var i = order.indexOf(state.tab);
      var next = order[(i + (ev.key === 'ArrowRight' ? 1 : order.length - 1)) % order.length];
      state.tab = next;
      rerenderPreservingScroll();
      var nb = document.getElementById('tab-' + next);
      if (nb) nb.focus();
    }
    if (ev.key === 'Escape' && state.drawer) { state.drawer = false; render(); }
  });

  function t(act) {
    var b = document.querySelector('[data-act="' + act + '"]');
    if (b) b.click();
  }

  document.addEventListener('change', function (ev) {
    var el = ev.target;
    var act = el.getAttribute && el.getAttribute('data-act');
    if (act === 'f-scope') { state.scope = el.value; rerenderPreservingScroll(); }
    else if (act === 'f-kind') { state.kind = el.value; rerenderPreservingScroll(); }
    else if (act === 'f-status') { state.status = el.value; rerenderPreservingScroll(); }
    else if (act === 'x-status') { state.exStatus = el.value; render(); }
    else if (act === 'x-doc') { state.exDoc = el.value; render(); }
    else if (act === 's-density') { state.settings.density = el.value; render(); }
    else if (el.id === 'import-file' && el.files && el.files[0]) {
      pendingFile = { name: el.files[0].name, size: el.files[0].size };
      refreshImport();
    }
  });

  /* 抽屉遮罩 */
  $('#scrim').addEventListener('click', function () { state.drawer = false; render(); });
  $('#nav-scrim').addEventListener('click', function () { state.navOpen = false; render(); });

  /* 紧凑密度 */
  var st = document.createElement('style');
  st.textContent = '.dense{line-height:1.45}.dense .result{padding:10px 16px 11px}.dense .db-row{padding:9px 10px}.dense .read-p{line-height:1.8;margin-bottom:12px}';
  document.head.appendChild(st);

  render();
})();
</script>
</body>
</html>
